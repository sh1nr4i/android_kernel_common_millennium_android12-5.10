name: Build Chihiro Kernel

on:
  push:
    branches:
      - chihiro-main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libelf-dev libncurses5-dev python3 dwarves curl tar xz-utils make

      - name: Setup Swap Space
        run: |
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Download AOSP Clang Toolchain (clang-r416183b)
        run: |
          mkdir -p clang
          echo "Downloading clang-r416183b..."
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r0.16/clang-r416183b.tar.gz" | tar -xz -C clang/
          ./clang/bin/clang --version

      - name: Build Kernel
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          mkdir -p out
          make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- gki_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- Image.gz

      - name: Check Build Artifacts
        run: |
          ls -lh out/arch/arm64/boot/Image.gz
          md5sum out/arch/arm64/boot/Image.gz
          sha256sum out/arch/arm64/boot/Image.gz

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chihiro-Image.gz
          path: out/arch/arm64/boot/Image.gz
          retention-days: 14

      - name: Push Prebuilt to Device Common-Kernel Repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            git config --global user.name "sh1nr4i"
            git config --global user.email "sh1nr4i@users.noreply.github.com"
            git clone --depth=1 --branch seventeen https://x-access-token:${GH_TOKEN}@github.com/sh1nr4i/android_device_millennium_common-kernel.git device_repo
            cp out/arch/arm64/boot/Image.gz device_repo/chihiro/Image.gz
            cd device_repo
            if git diff --quiet chihiro/Image.gz; then
              echo "No changes in chihiro/Image.gz"
            else
              git add chihiro/Image.gz
              git commit -m "common-kernel: Update Chihiro kernel image" -m "Compiled from sh1nr4i/android_kernel_common_millennium_android12-5.10@${{ github.sha }}" -m "Governor fixes, reflex rate_limit_us compatibility, fastpath optimization, O3 optimization"
              git push origin seventeen
              echo "Successfully pushed updated Chihiro Image.gz to sh1nr4i/android_device_millennium_common-kernel (seventeen)!"
            fi
          else
            echo "GH_TOKEN not available, skipping automatic push"
          fi
